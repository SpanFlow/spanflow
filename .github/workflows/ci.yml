# Builds and tests the published libraries (mapping, expressions, connectors) and the standalone designer on every push and pull
# request. It can only use what is in this repository, which is the proof that the published tree builds without any private code.
# (Libraries-only release: replaced by the full CI when the whole product is published.)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The libraries target net8.0, net9.0 and net10.0, and the tests run on each.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test
        run: dotnet test src/UFMapping/tests/SpanFlow.Mapping.Tests/SpanFlow.Mapping.Tests.csproj -c Release
      - name: Test the designer API (standalone mode)
        run: dotnet test src/UFMapping/tests/SpanFlow.Mapping.Designer.Tests/SpanFlow.Mapping.Designer.Tests.csproj -c Release

  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The expression and connector libraries target net8.0, net9.0 and net10.0, and the tests run on each.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test
        run: dotnet test src/DataFlow/libs/tests/SpanFlow.Libraries.Tests/SpanFlow.Libraries.Tests.csproj -c Release

  designer-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the UI and the API together, the way the published image is built (not pushed).
      - name: Build the designer image
        run: docker build src/UFMapping -f src/UFMapping/Dockerfile.designer --build-context admin=src/Platform/platform-admin -t mapping-designer
