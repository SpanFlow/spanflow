# Packs one family of SpanFlow's MIT libraries from this repository and pushes it to nuget.org:
#   mapping     SpanFlow.Mapping.Core, SpanFlow.Mapping.Engine
#   libraries   SpanFlow.Expressions, SpanFlow.Connectors.Abstractions, .Http, .Files, .Database
#
# Run it by hand: Actions > nuget > Run workflow, with the family, the package version and the tag to pack
# (e.g. v1.0.1). Each family has its own versions, independent of SpanFlow release versions, starting at 1.0.0.
# Every package of a family gets the same version, and the packages in it depend on each other at that version.
#
# Sign-in is nuget.org Trusted Publishing: no API key is stored here. GitHub's OIDC token is exchanged for a
# short-lived key, which nuget.org only issues to this repository + this workflow file (+ the `nuget` environment),
# as configured in the publishing policy owned by the SpanFlow organisation on nuget.org.
# Repository variable NUGET_USER = the nuget.org user name (profile name, not email) that created that policy.
name: nuget

on:
  workflow_dispatch:
    inputs:
      family:
        description: Which packages (mapping = SpanFlow.Mapping.*; libraries = SpanFlow.Expressions + SpanFlow.Connectors.*)
        type: choice
        options: [mapping, libraries]
        default: mapping
      version:
        description: Package version (semver, 1.0.0 or later)
        required: true
        default: 1.0.0
      ref:
        description: Tag or branch to pack (e.g. v1.0.1)
        required: true
        default: main
      publish:
        description: Push to nuget.org (off = pack only; the packages are kept as a run artifact)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Trusted Publishing

concurrency: nuget

jobs:
  pack:
    runs-on: ubuntu-latest
    environment: nuget
    env:
      VERSION: ${{ inputs.version }}
      FAMILY: ${{ inputs.family }}
      DOTNET_NOLOGO: true
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be semver starting at 1.0.0 (got '$VERSION')" >&2; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The family's test project and the projects to pack. Test projects, not solutions: they work in the full
      # tree and in a libraries-only one.
      - name: Pick the family
        run: |
          case "$FAMILY" in
            mapping)
              echo "TESTS=src/UFMapping/tests/SpanFlow.Mapping.Tests/SpanFlow.Mapping.Tests.csproj" >> "$GITHUB_ENV"
              echo "PROJECTS=src/UFMapping/src/SpanFlow.Mapping.Core/SpanFlow.Mapping.Core.csproj src/UFMapping/src/SpanFlow.Mapping.Engine/SpanFlow.Mapping.Engine.csproj" >> "$GITHUB_ENV"
              ;;
            libraries)
              echo "TESTS=src/DataFlow/libs/tests/SpanFlow.Libraries.Tests/SpanFlow.Libraries.Tests.csproj" >> "$GITHUB_ENV"
              projects=""
              for p in SpanFlow.Expressions SpanFlow.Connectors.Abstractions SpanFlow.Connectors.Http SpanFlow.Connectors.Files SpanFlow.Connectors.Database; do
                projects="$projects src/DataFlow/libs/$p/$p.csproj"
              done
              echo "PROJECTS=$projects" >> "$GITHUB_ENV"
              ;;
            *) echo "unknown family '$FAMILY'" >&2; exit 1 ;;
          esac

      # The tests run on every runtime the packages target (net481 is Windows-only and skipped here).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Test
        run: dotnet test "$TESTS" -c Release

      # Source Link is off in the private source repos; here the checkout IS the public repo, so the packages
      # and their symbols point at this exact commit on github.com/SpanFlow/spanflow.
      - name: Pack
        run: |
          for p in $PROJECTS; do
            dotnet pack "$p" -c Release -o packages \
              -p:Version="$VERSION" \
              -p:ContinuousIntegrationBuild=true \
              -p:EnableSourceLink=true \
              -p:EnableSourceControlManagerQueries=true
          done
          ls -l packages

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ inputs.family }}-${{ inputs.version }}
          path: packages/

      - name: NuGet login (Trusted Publishing)
        if: inputs.publish
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushes each .nupkg and its .snupkg. --skip-duplicate makes a re-run after a partial failure safe;
      # nuget.org never lets a published version be replaced, so bump the version to change a package.
      - name: Push
        if: inputs.publish
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
