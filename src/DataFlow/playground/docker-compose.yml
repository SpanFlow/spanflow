# The libraries playground on your own server, with a PostgreSQL to try it on:
#
#   PLAYGROUND_KEY=choose-a-long-key docker compose -f playground/docker-compose.yml up -d
#
# Then open http://<server>:8080/?key=<the key> once. In the page, Database connections > Add:
#   Provider postgres, Host=postgres;Database=app;Username=app;Password=app
# Drop the postgres service if you bring your own databases.
#
# Build from the source instead of pulling: replace `image:` with
#   build: { context: .., dockerfile: playground/Dockerfile }          (the libraries from libs/)
#   build: { context: .., dockerfile: playground/Dockerfile.nuget }    (the libraries from NuGet)
services:
  playground:
    image: ghcr.io/spanflow/libraries-playground:latest
    restart: unless-stopped
    ports:
      - "${PLAYGROUND_PORT:-8080}:8080"
    environment:
      Playground__AccessKey: ${PLAYGROUND_KEY:?set PLAYGROUND_KEY to the key the page asks for}
    volumes:
      - playground-data:/data            # saved flows, connections and stores
      - ./files:/data/files              # what Convert file nodes read and write
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  playground-data:
  postgres-data:
